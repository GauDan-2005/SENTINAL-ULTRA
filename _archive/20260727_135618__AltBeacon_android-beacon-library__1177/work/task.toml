difficulty_explanation = """A new public configuration API for the library: an all-optional Settings type that describes a delta, a Java-facing builder, a defaults singleton, four scan strategy implementations with value equality, a distance calculator factory, and three apply methods on BeaconManager with different merge semantics (delta merge, replace-with-defaults, revert). The subtlety is in the merge rules and in wiring every field through to the existing static configuration surface without breaking it, across both Kotlin and Java call sites."""

