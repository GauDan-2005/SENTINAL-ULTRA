difficulty_explanation = "Six independent hypothesis tests have to be built from scratch and five of them have to agree numerically with an established reference implementation, so a plausible-looking formula is not enough. The hard parts are the ones that only show up at the edges: the Mann-Whitney exact distribution and its tie handling, the continuity correction on the asymptotic branch, which of the two tails each alternative reports, the degrees-of-freedom bookkeeping in the chi-square and ANOVA statistics, the D'Agostino skewness transform, and the Anderson-Darling statistic, whose sum pairs a forward index against a reversed one and which reports the unadjusted value while deriving its p-value from an adjusted one. Each test also needs a NaN policy and an error enum with variants that fire on specific input conditions in a specific order, so the work is wide as well as deep."
