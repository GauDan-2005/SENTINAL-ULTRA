difficulty_explanation = "Changing ziti_ctrl_init from a single URL to a list of endpoints ripples through config loading, context wiring and both enrollment paths, and every existing caller has to keep compiling. The failover itself is the harder half: the switch may only happen once nothing else is in flight, so the request counter has to be raised and lowered on the right side of the response callback, and the failing request still has to report CONTROLLER_UNAVAILABLE to its own caller. Endpoint selection has to prefer endpoints believed online and still make progress when none are."
