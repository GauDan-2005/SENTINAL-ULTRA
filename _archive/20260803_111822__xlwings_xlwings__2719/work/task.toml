difficulty_explanation = "The lazy/eager book contract has to be threaded through four files that do not obviously belong together: the abstract signatures in xlwings/base_classes.py, the public wrappers in xlwings/main.py, the Office.js backend in xlwings/pro/_xlremote.py, and the script argument binder in xlwings/pro/udfs_officejs.py. The three-state values argument is the part that is easy to get wrong, because None does not mean False: on a lazy book it means metadata only, on a regular book it means a full load, and an explicit False has to beat the book's eagerness in both directions. Two more requirements defeat the natural implementation. The per-sheet loaded flag cannot be keyed on the sheet name, because a sheet can be renamed without a round trip, and a metadata-only refresh must not let the empty payload it receives overwrite values that an earlier load already fetched. The script binder is a separate mechanism again, since the caller builds the book eagerly and cannot see the parameter annotation, so the laziness has to be applied after injection."
tags = ["async", "lazy-loading", "excel", "office-js", "api-design"]
