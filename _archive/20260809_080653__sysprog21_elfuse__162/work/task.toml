difficulty_explanation = "The syscall has to be routed end to end through a generated dispatch table, and the CPU accounting it reports cannot be taken from the host aggregate the obvious implementation would reach for. The emulator forks its own helper subprocesses, so the host's children accounting mixes their CPU in with the guest's, and the counters have to be fed only at reaps of processes the guest itself owns. On top of that a child may be reported more than once, on a stop, on a continue and finally on exit, and only the terminal report may be credited, so a straightforward implementation silently counts the same CPU two or three times."
source_pr_url = "https://github.com/sysprog21/elfuse/pull/162"
