# Two different measurements, on two different suites — read the denominators.
# gpt_5_5 "0/4" is the platform's own difficulty screen on the EXPANDED suite (the
# client-identity revision this one descends from): four valid trials, none solved,
# screen verdict PASS HARD. It is a platform-run figure, carried across unaltered.
# opus_4_8 "0/3" is the authoring round's own k=3 probe against the PRE-EXPANSION
# suite (TLS transport only), and it is left at k=3 rather than restated at the k=8
# the platform runs, because nobody ran eight. Neither number is tuned to agree with
# the declared tier; the screen runs the agent and ignores this file either way.
# difficulty_explanation below says which revision each figure covers.
