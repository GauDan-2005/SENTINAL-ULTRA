model_difficulty = "hard"
difficulty_explanation = "Opt-in TLS to the wrapped app, and then the harder half: proving the adapter's own identity to an app that demands one. The first part is small in line count and large in blast radius - making the adapter speak https means swapping the connector type the Adapter struct, its constructor and its public with_client signature are all generic over, and threading a scheme through both URL builders. The readiness path is the trap: it lives where the options never reach, so it has to become client-aware or the healthcheck keeps going out in cleartext while the proxied request looks fixed. Client authentication then adds a second axis the agent has to reason about rather than wire up: the identity has to travel on the readiness port as well as the request, and an identity that cannot be used - half a pair, a file holding nothing usable - must fail the request closed instead of quietly connecting as a stranger, which is the shortcut a hurried implementation takes. The switch cuts both ways, and one reading of the identity decides both directions: with TLS on an unusable identity must fail the request closed, and with TLS off the very same variables are inert, because a deployment that never asked for TLS cannot be broken by a certificate someone left in the environment. An implementation that reads the identity before it looks at the switch satisfies the first and breaks the second. Scope: 4 source files plus a worked example, +143/-33 in src/lib.rs alone; 38 graded nodes, 17 fail_to_pass. Tier evidence, in the order it carries weight. The platform difficulty screen has now run on both shapes of this task: on the pre-expansion suite, TLS transport only, it returned FAIL EASY with codex-gpt-5-5 at 4/4 solved, which is precisely what the client-identity expansion answers; on the expanded suite it returned PASS HARD with codex-gpt-5-5 at 0/4, every trial failing on the fail-closed identity nodes. The revision after that never reached a solve arm at all - its oracle was blocked by an environment defect of ours, a solution lock file pinning crate versions the airgapped image could not supply, fixed here and now asserted at image-build time. This revision is that same expanded surface plus two nodes covering the switch-off direction of the identity rule."
tags = ["https", "tls", "rust", "hyper-rustls", "reverse-proxy", "aws-lambda"]
