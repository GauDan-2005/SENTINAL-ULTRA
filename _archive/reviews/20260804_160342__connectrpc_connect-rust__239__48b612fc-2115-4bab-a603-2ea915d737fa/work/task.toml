difficulty_explanation = "The work spans three crates and is more judgement than volume. The solver has to treat compiler output as trusted and reflection input as untrusted, then honour two overrides on both codegen entry points in both directions. The hard part is precedence: the plugin option is per-plugin and must beat BUFFA_ELEMENT_MEMORY_LIMIT when both are set, while the env var is the only knob a build script has and must still reach the plugin when the option is absent. Accepting leftover option text after a fixed high decode does not pass. Reflection must stay on the untrusted default even if that env var is unlimited. Diagnostics and the cargo rebuild trigger are easy to miss because they only show up on the failing or stale-rebuild path."
tags = ["protobuf", "code-generation", "decode-limits", "error-handling", "rust", "descriptor-set"]
