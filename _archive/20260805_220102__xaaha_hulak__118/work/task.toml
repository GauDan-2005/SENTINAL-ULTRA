difficulty_explanation = "Mouse support has to be threaded through two existing Bubble Tea screens at once. The zone layer, the dropdown methods, the picker, the explorer and the detail form all have to agree on how a click turns into an action, the marked regions only line up if every view renders through the scan, and none of the keyboard, vim motion or filtering behaviour may change. The detail form adds the part that is easy to get wrong: the rows an input object expands into share one argument name, so switching one on has to reach that row alone, while a row standing for a whole argument and the rows of a list argument still move as a group. The obvious implementation copies the existing keyboard path and switches all the siblings together."
