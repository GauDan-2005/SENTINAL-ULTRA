difficulty_explanation = "The change replaces four hand-maintained copies of the same per-provider secret plumbing with one manifest, across an Electron main process, a sandboxed preload that cannot import the manifest, and the settings store. The work is not writing the manifest, it is finding every place that has to derive from it and keeping the seven existing accessor names, environment variables and IPC channels working while a new provider is added. An implementation that builds the manifest and the generated accessors but misses the main-process channel registration, or lets the preload copy drift from it, leaves a key that saves but never loads."
