# facts.yml — the single machine-readable source for every numeric and enumerated
# fact in this workspace.
#
# Why this file exists: the same number lives in CLAUDE.md, in the three rule files,
# in their three skill twins and in learning/. When one copy moves and the others do
# not, the workspace ships a wrong number. That is this repo's most common defect
# class. Every check script reads its thresholds from here instead of carrying its
# own copy, and `bin/doclint.sh` compares the prose against these entries.
#
# EDIT RULE: change a number here FIRST, then run `bin/doclint.sh` and fix every
# file it names. Never change a number in prose only.
#
# ── schema ───────────────────────────────────────────────────────────────────
#   id           snake_case key. Stable. Other scripts index on it.
#   value        the fact itself. Scalar, list, or a mapping of named bounds.
#   statement    one sentence a human can read, stating the fact.
#   source       where the fact was established. A docs/ path or a learning/ note.
#                No line numbers: the notes churn and a stale line ref is worse
#                than none.
#   appears_in   repo files that state this fact in prose. doclint greps these.
#                Never list docs/ here — that is an upstream export and is not
#                ours to lint. Never list the source note either.
#                An entry ending in "/" is a DIRECTORY GROUP: it expands to every
#                .md inside and counts as one logical target, so a fact stated in
#                one member does not raise a stale warning about the others.
#                `.claude/rules/` is why this exists. The eleven numbered sections
#                moved out of CLAUDE.md into one file each on 2026-08-05, so the
#                union of that directory is what a single CLAUDE.md entry used to
#                cover. A drift problem still names the individual rule file.
#   pattern      regex that locates candidate lines inside appears_in files.
#   kind         "rule"  = the platform enforces it, a violation fails something.
#                "hint"  = local guidance, calibration, a target band. Never a gate.
#   verified_on  date the fact was last confirmed against a real platform run.
#   enforced_by  which check script or platform phase acts on it.
#   contradicts  OPTIONAL. Curated regexes. A match inside an appears_in file is a
#                FAIL: the line states this fact wrongly. Every regex here was
#                tuned against the tree, so a hit is a real defect, not a guess.
#   numeric_claim OPTIONAL. {locate: <regex with group 1 = a number>, equals: <n>}
#                Every line matching `locate` must carry that number.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  version: 1
  updated: 2026-08-06
  precedence: >-
    docs/ wins on policy and judgment. learning/ wins on observed platform
    behaviour. This file wins on the number itself, because it is the only copy
    that is machine-checked.

facts:

  # ── the test suite ────────────────────────────────────────────────────────
  - id: fail_to_pass_range
    value: {min: 10, max: 20, target_min: 11, target_max: 20}
    statement: "The static check enforces a hard 10-20 range on grading.fail_to_pass; 21+ fails the build."
    source: learning/static-checks.md
    kind: rule
    verified_on: 2026-07-31
    enforced_by: platform static check "config"; bin/checks/10-static.sh
    appears_in:
      - CLAUDE.md
      - .claude/rules/
      - .cursor/rules/sentinel-task-check.mdc
      - .claude/skills/sentinel-task-check/SKILL.md
      - .cursor/rules/sentinel-task-fixing.mdc
      - .claude/skills/sentinel-task-fixing/SKILL.md
    pattern: 'fail[_ -]to[_ -]pass|fail_to_pass'
    contradicts:
      - regex: '(?i)at least 10 fail.to.pass'
        why: "states a floor with no ceiling; 21+ is rejected"
      - regex: '(?i)reach at least 10'
        why: "prescribes a floor as the bar; the bar is a range"
      - regex: '(?i)ideally 10.20'
        why: "the range is hard, not ideal"
        unless: '(?i)hard|ceiling|rejected|both ends|reads as|floor'
      - regex: '(?i)10.20 ideal'
        why: "the range is hard, not ideal"
        unless: '(?i)hard|ceiling|rejected|both ends|reads as|floor'
      - regex: '(?i)count is\s*(?:>=|≥|at least)\s*10'
        why: "no ceiling stated"
      - regex: '(?i)treat 11\+ as the safe bar'
        why: "11+ has no upper bound; the safe bar is 11-20"

