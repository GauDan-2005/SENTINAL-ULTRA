  - id: zip_command
    value: "zip -rXy"
    statement: "Zip from inside the working copy with zip -rXy. -X keeps directory entries so an empty .git/refs/ survives, -y keeps symlinks as symlinks."
    source: learning/dirty-repo-and-symlinks.md
    kind: rule
    verified_on: 2026-08-04
    enforced_by: bin/checks/30-package.sh
    appears_in:
      - .claude/rules/
      - .cursor/rules/sentinel-task-fixing.mdc
      - .claude/skills/sentinel-task-fixing/SKILL.md
      - learning/static-checks.md
    pattern: 'zip -r'
    contradicts:
      - regex: 'zip\s+-rX(?![Xy])'
        why: "-X without -y flattens symlinks into regular files at packaging time"
      - regex: 'zip\s+-rD'
        why: "-D drops directory entries and breaks .git/refs/ on the platform"
        unless: '(?i)never|avoid|not use|instead|drop|break|silently'

