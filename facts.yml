    kind: rule
    verified_on: 2026-08-04
    enforced_by: bin/checks/40-grader.sh
    appears_in:
      - CLAUDE.md
      - .claude/rules/
      - .cursor/rules/sentinel-task-fixing.mdc
      - .claude/skills/sentinel-task-fixing/SKILL.md
    pattern: 'raw_exit_code|fail[- ]open|fails closed'

  # ── the eval gates ────────────────────────────────────────────────────────
  - id: quality_check_criteria
    value: {total: 15, must_have_blocks: true, id_prefix: "Q"}
    statement: "The Quality Check reports 15 numbered criteria and any failed must-have criterion blocks, including criterion: Instructions items."
    source: learning/quality-check-criteria.md
    kind: rule
    verified_on: 2026-08-02
    enforced_by: platform Quality Check
    appears_in:
      - CLAUDE.md
      - .claude/rules/
      - .cursor/rules/sentinel-task-check.mdc
      - .claude/skills/sentinel-task-check/SKILL.md
    pattern: '(?i)must-have|Quality Check'

  - id: quality_axis_thresholds
    value: {axes: 10, judges: 2, adjudicate_delta: 2, remove_at_or_below: 2.0, discuss_at_or_below: 3.0, ok_above: 3.0}
    statement: "Two judges score 10 axes. Only test_coverage and test_faithfulness flip the verdict: REMOVE at 2.0 or below, DISCUSS at 3.0 or below, OK above 3.0."
    source: docs/tasking-guide.md
    kind: rule
    verified_on: 2026-08-02
    enforced_by: platform Quality Check
    appears_in:
      - CLAUDE.md
      - .claude/rules/
    pattern: 'test_coverage|test_faithfulness|REMOVE|DISCUSS'

  - id: review_gate
    value: {stages: 2, first: "agentic judge", second: "difficulty screen", second_runs_only_if_first_passed: true, report_field: "Agentic Judge Quality Report", is_final_difficulty_grade: false}
    statement: "The review gate runs before a reviewer sees the task: the agentic judge first, then a cheap single-arm difficulty screen that runs only if the judge passed. It is not the final difficulty grade, the full rollout runs after a reviewer accepts. A block is a content-side result to act on, and the per-axis reasons sit in the collapsed 'Agentic Judge Quality Report' field on the submission."
    source: docs/faq.md
    kind: rule
    verified_on: 2026-08-06
    enforced_by: platform review gate
    appears_in:
      - CLAUDE.md
      - .claude/rules/
      - .cursor/rules/sentinel-difficulty-scope.mdc
      - .claude/skills/sentinel-difficulty-scope/SKILL.md
      - .cursor/rules/quality-rehearsal.mdc
      - .claude/skills/quality-rehearsal/SKILL.md
    pattern: '(?i)review gate|agentic judge|difficulty screen'

  - id: related_pr_difficulty_material
    value: {allowed: true, bounds: ["related PR only", "no wholesale copy", "no change to original scope or feature"]}
    statement: "When a task comes back too easy, difficulty material may be adapted from a later RELATED PR in the same repo. Never an unrelated PR, never a wholesale copy, and never a change to the scope or feature of the original PR."
    source: docs/faq.md
    kind: rule
    verified_on: 2026-08-06
    enforced_by: reviewer, PR Scope Violation
    appears_in:
      - .claude/rules/
      - .cursor/rules/sentinel-difficulty-scope.mdc
      - .claude/skills/sentinel-difficulty-scope/SKILL.md
    pattern: '(?i)related PR|later PR'

  - id: download_packaging_varies
    value: {upload_is_flat: true, known_download_shapes: ["zip root", "task/", "seed/", "*_harborized/"], runs_dir_optional: true}
    statement: "A downloaded task zip may hold the five task entries at the zip root or under a wrapper such as task/ or seed/, and runs/ may be absent. Locate the directory by its contents. The UPLOAD zip is always flat, with no wrapper and no runs/."
    source: docs/harbor-framework.md
    kind: rule
    verified_on: 2026-08-06
    enforced_by: platform static check "layout"; bin/checks/30-package.sh
    appears_in:
      - CLAUDE.md
      - INDEX.md
      - .claude/rules/
      - .cursor/rules/sentinel-task-check.mdc
      - .claude/skills/sentinel-task-check/SKILL.md
    pattern: '(?i)seed/|zip root|packaging (can )?var|wrapper'

  - id: prescriptiveness_check
    value: {threshold_above: 0.50, blocking: false, phase: "CodeBuild BUILD", id_prefix: "P"}
    statement: "The prescriptiveness check scores instruction.md and passes above 0.50. It fails the build phase but is explicitly non-blocking for submission. It is a different check from the Quality Check's Instructions criteria, which do block."
    source: learning/prescriptiveness-check.md
    kind: rule
    verified_on: 2026-08-02
    enforced_by: platform BUILD phase
    appears_in:
      - CLAUDE.md
      - .claude/rules/
    pattern: '(?i)prescriptiveness'

  - id: difficulty_pass_at_k
    value: {trials: 8, medium_max_solves: 4, hard_max_solves: 2}
    statement: "A frontier model solves a Medium task in at most 4 of 8 attempts and a Hard task in at most 2 of 8."
    source: docs/guidelines.md
    kind: rule
    verified_on: 2026-07-31
    enforced_by: platform Difficulty Check
    appears_in:
      - .claude/rules/
      - .cursor/rules/sentinel-difficulty-scope.mdc
      - .claude/skills/sentinel-difficulty-scope/SKILL.md
    pattern: '(?i)pass@k|4 of 8|2 of 8'

  - id: pending_revision_limit
    value: 2
    statement: "At most two tasks may sit in pending-revision at once or the platform blocks a new claim."
    source: docs/tasking-guide.md
    kind: rule
    verified_on: 2026-07-31
    enforced_by: platform claim flow
    appears_in:
      - CLAUDE.md
      - .claude/rules/
    pattern: '(?i)pending.revision'

  - id: inapp_check_runtime_limit_min
    value: 5
    statement: "In-app checks have a 5-minute runtime limit; iterate with Send to reviewer unchecked."
    source: docs/tasking-guide.md
    kind: rule
    verified_on: 2026-07-31
    enforced_by: platform
    appears_in:
      - .claude/rules/
    pattern: '(?i)5-minute|five-minute'

  # ── local guidance, never a gate ──────────────────────────────────────────
  - id: handling_time_total_band
    value: {min: 180, max: 240, fields: [review, rewrite, form], excludes: revisions}
    statement: "Total submission time is fields 1 + 2 + 3 and targets 180 to 240 minutes. The revision field is never part of it."
